services:
  worker:
    build: 
      context: .
      target: worker-stage
    container_name: sure-sync-worker
    env_file:
      - .env
    environment:
      - CONSUME_PATH=/app/consume
      - PROCESSED_DIR=/app/consume/processed
      - FAILED_DIR=/app/consume/failed
    volumes:
      - "${CONSUME_PATH}:/app/consume"
      - "${DATA_PATH}:/app/data"
    restart: unless-stopped
  
  web:
    build: 
      context: .
      target: web-stage
    container_name: sure-sync-web
    env_file:
      - .env
    ports:
      - "9000:8000"
    volumes:
      - ${DATA_PATH}:/app/data
    restart: unless-stopped
    depends_on:
      - worker