services:
  worker:
    build: 
      context: .
      target: worker-stage
    container_name: sure-sync-worker
    env_file:
      - .env
    volumes:
      - ${CONSUME_PATH}:/app/consume
      - ${CONSUME_PATH}/processed:/app/processed
      - ${DATA_PATH}:/app/data
      - ./account-mapping.yml:/app/data/account-mapping.yml:ro
    restart: unless-stopped
  
  web:
    build: 
      context: .
      target: web-stage
    container_name: sure-sync-web
    env_file:
      - .env
    ports:
      - "9000:8000"
    volumes:
      - ${DATA_PATH}:/app/data
    restart: unless-stopped
    depends_on:
      - worker