<!DOCTYPE html>
<html>
    <head>
        <title>Sure Sync Web</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <link rel="stylesheet" href="/static/style.css">
        <script src="/static/app.js" defer></script>
    </head>

    <body>
        <div class="topbar">
            <a href="/settings" class="settings-link">
                <i class="fa-solid fa-gear"></i>
                <span>Accounts</span>
            </a>
        </div>

        <div class="grid">
            <div class="card">
                <div class="label">
                    Files Log
                </div>

                <div class="stats">
                    <div class="stat-row processed">
                        <div class="stat-label">Processed</div>
                        <div class="value" id="files-processed">0</div>
                    </div>

                    <div class="stat-row success">
                        <div class="stat-label">Success</div>
                        <div class="value" id="files-success">0</div>
                    </div>

                    <div class="stat-row failed">
                        <div class="stat-label">Failed</div>
                        <div class="value" id="files-failed">0</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
