<!DOCTYPE html>
<html>
    <head>
        <title>Sure Sync Web</title>
        <link rel="stylesheet" href="style.css">
        <script src="app.js" defer></script>
    </head>

    <body>
        <div class="grid">
            <div class="card">
                <div class="label">
                    Files Log
                </div>

                <div class="stats">
                    <div class="stat-row processed">
                        <div class="stat-label">Processed</div>
                        <div class="value" id="files-processed">0</div>
                    </div>

                    <div class="stat-row success">
                        <div class="stat-label">Success</div>
                        <div class="value" id="files-success">0</div>
                    </div>

                    <div class="stat-row failed">
                        <div class="stat-label">Failed</div>
                        <div class="value" id="files-failed">0</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
